<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>タッチテスト</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; touch-action: manipulation; }
body { font-family: sans-serif; padding: 20px; background: #fdf0f5; }
.log { background: white; border: 1px solid #ccc; padding: 10px; min-height: 100px; margin-bottom: 16px; font-size: 14px; border-radius: 8px; }
.card {
  width: 80px; height: 120px;
  background: linear-gradient(135deg, #e8a0b0, #c06080);
  border-radius: 8px;
  display: inline-block;
  margin: 8px;
  cursor: pointer;
  user-select: none;
  -webkit-tap-highlight-color: rgba(255,255,255,0.3);
  position: relative;
  overflow: hidden;
}
.card img { width: 100%; height: 100%; object-fit: cover; pointer-events: none; }
.btn {
  display: block; width: 100%; padding: 16px;
  background: #c06080; color: white; border: none;
  border-radius: 8px; font-size: 18px; margin-bottom: 8px;
  cursor: pointer; touch-action: manipulation;
}
</style>
</head>
<body>
<div class="log" id="log">ここにタップ結果が出ます</div>

<button class="btn" onclick="log('ボタンonclick発火！')">ボタンをタップ</button>

<div style="margin: 16px 0;">
  <div class="card" id="card1" onclick="log('カード1 onclick！')">
    <div style="color:white;text-align:center;padding-top:40px;font-size:12px;">カード1<br>onclick</div>
  </div>
  <div class="card" id="card2">
    <div style="color:white;text-align:center;padding-top:40px;font-size:12px;">カード2<br>addEventListener</div>
  </div>
  <div class="card" id="card3">
    <div style="color:white;text-align:center;padding-top:40px;font-size:12px;pointer-events:none;">カード3<br>img代わり</div>
  </div>
</div>

<script>
function log(msg) {
  const el = document.getElementById('log');
  const time = new Date().toLocaleTimeString();
  el.innerHTML = '<b style="color:green;">' + time + ': ' + msg + '</b><br>' + el.innerHTML;
}

// カード2: addEventListener
document.getElementById('card2').addEventListener('click', function() {
  log('カード2 addEventListener発火！');
});

// カード3: touchstart + touchend両方
document.getElementById('card3').addEventListener('touchstart', function(e) {
  log('カード3 touchstart');
}, {passive: true});
document.getElementById('card3').addEventListener('touchend', function(e) {
  e.preventDefault();
  log('カード3 touchend発火！');
}, {passive: false});
document.getElementById('card3').addEventListener('click', function() {
  log('カード3 click発火！');
});

log('ページ読み込み完了！タップしてみてください');
</script>
</body>
</html>
